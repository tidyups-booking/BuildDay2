openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Book My Cleaning — AI receptionist for Jobber cleaning companies
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: company
  - name: phone
  - name: services
  - name: team
  - name: calls
  - name: bookings
  - name: dashboard
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /company:
    get:
      operationId: getCompany
      tags: [company]
      summary: Get the current user's company (404 if none yet)
      responses:
        "200":
          description: Company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "404":
          description: No company yet
    post:
      operationId: createCompany
      tags: [company]
      summary: Create the company workspace for the current user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
    patch:
      operationId: updateCompany
      tags: [company]
      summary: Update company settings / receptionist configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
  /company/jobber/connect:
    post:
      operationId: connectJobber
      tags: [company]
      summary: Connect the company's Jobber account (simulated OAuth until keys are configured)
      responses:
        "200":
          description: Connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
  /company/jobber/disconnect:
    post:
      operationId: disconnectJobber
      tags: [company]
      summary: Disconnect Jobber
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
  /company/go-live:
    post:
      operationId: goLive
      tags: [company]
      summary: Mark setup complete and take the receptionist live
      responses:
        "200":
          description: Live
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
  /company/quo/connect:
    post:
      operationId: connectQuo
      tags: [phone]
      summary: Connect this company's own Quo workspace with their API key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectQuoInput"
      responses:
        "200":
          description: Connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
  /company/quo/disconnect:
    post:
      operationId: disconnectQuo
      tags: [phone]
      summary: Disconnect the Quo workspace and remove registered webhooks
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
  /quo/numbers:
    get:
      operationId: listQuoNumbers
      tags: [phone]
      summary: List the real phone numbers in the connected Quo workspace
      responses:
        "200":
          description: Quo numbers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuoNumber"
    post:
      operationId: selectQuoNumbers
      tags: [phone]
      summary: Choose which Quo lines the receptionist watches and register webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoNumberSelection"
      responses:
        "200":
          description: Watched lines updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
  /calls/sync:
    post:
      operationId: syncCallsFromQuo
      tags: [calls]
      summary: Backfill recent calls, Sona transcripts, and summaries from Quo
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"
  /services:
    get:
      operationId: listServices
      tags: [services]
      summary: List the company's services and price ranges
      responses:
        "200":
          description: Services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"
    post:
      operationId: createService
      tags: [services]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
  /services/{id}:
    patch:
      operationId: updateService
      tags: [services]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
    delete:
      operationId: deleteService
      tags: [services]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
  /team:
    get:
      operationId: listTeamMembers
      tags: [team]
      summary: List team members
      responses:
        "200":
          description: Team members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamMember"
    post:
      operationId: inviteTeamMember
      tags: [team]
      summary: Invite a dispatcher or cleaner (invite email simulated for now)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamMemberInput"
      responses:
        "201":
          description: Invited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"
  /team/{id}:
    delete:
      operationId: removeTeamMember
      tags: [team]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed
  /calls:
    get:
      operationId: listCalls
      tags: [calls]
      summary: List calls, most recent first
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Calls
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Call"
  /calls/{id}:
    get:
      operationId: getCall
      tags: [calls]
      summary: Get a call with its full transcript and extracted answers
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Call detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallDetail"
        "404":
          description: Not found
  /calls/simulate:
    post:
      operationId: simulateTestCall
      tags: [calls]
      summary: Run a simulated test call using the company's receptionist configuration
      responses:
        "201":
          description: Simulated call created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallDetail"
  /bookings:
    get:
      operationId: listBookings
      tags: [bookings]
      summary: List bookings created from calls
      responses:
        "200":
          description: Bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
  /bookings/{id}:
    patch:
      operationId: updateBooking
      tags: [bookings]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
  /bookings/{id}/sync-jobber:
    post:
      operationId: syncBookingToJobber
      tags: [bookings]
      summary: Push this booking into Jobber (simulated until Jobber is connected with real keys)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Synced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Key metrics for the dispatcher dashboard
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /dashboard/activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Recent activity feed (calls answered, bookings created, syncs)
      responses:
        "200":
          description: Activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    CustomQuestion:
      type: object
      required: [question, answer]
      properties:
        question: { type: string }
        answer: { type: string }
    SetupStatus:
      type: object
      required: [accountCreated, jobberConnected, quoConnected, phoneProvisioned, receptionistConfigured, teamInvited, isLive, completedSteps, totalSteps]
      properties:
        accountCreated: { type: boolean }
        jobberConnected: { type: boolean }
        quoConnected: { type: boolean }
        phoneProvisioned: { type: boolean }
        receptionistConfigured: { type: boolean }
        teamInvited: { type: boolean }
        isLive: { type: boolean }
        completedSteps: { type: integer }
        totalSteps: { type: integer }
    Company:
      type: object
      required: [id, name, greeting, collectFields, customQuestions, jobberConnected, quoConnected, watchedNumbers, isLive, setupStatus, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        greeting: { type: string }
        collectFields:
          type: array
          items: { type: string }
        customQuestions:
          type: array
          items:
            $ref: "#/components/schemas/CustomQuestion"
        ringThroughNumber: { type: ["string", "null"] }
        phoneNumber: { type: ["string", "null"] }
        jobberConnected: { type: boolean }
        jobberAccountName: { type: ["string", "null"] }
        quoConnected: { type: boolean }
        quoWorkspaceName: { type: ["string", "null"] }
        quoKeyLast4: { type: ["string", "null"] }
        watchedNumbers:
          type: array
          items:
            $ref: "#/components/schemas/QuoNumber"
        isLive: { type: boolean }
        setupStatus:
          $ref: "#/components/schemas/SetupStatus"
        createdAt: { type: string }
    CompanyInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
    CompanyUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        greeting: { type: string }
        collectFields:
          type: array
          items: { type: string }
        customQuestions:
          type: array
          items:
            $ref: "#/components/schemas/CustomQuestion"
        ringThroughNumber: { type: ["string", "null"] }
    QuoNumber:
      type: object
      required: [id, phoneNumber, name, watched]
      properties:
        id: { type: string }
        phoneNumber: { type: string }
        name: { type: string }
        watched: { type: boolean }
    ConnectQuoInput:
      type: object
      required: [apiKey]
      properties:
        apiKey:
          type: string
          minLength: 10
          description: A Quo workspace API key from the company's own Quo account
    QuoNumberSelection:
      type: object
      required: [numberIds]
      properties:
        numberIds:
          type: array
          items: { type: string }
    SyncResult:
      type: object
      required: [callsImported, transcriptsImported, message]
      properties:
        callsImported: { type: integer }
        transcriptsImported: { type: integer }
        message: { type: string }
    Service:
      type: object
      required: [id, name, priceMin, priceMax]
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: ["string", "null"] }
        priceMin: { type: number }
        priceMax: { type: number }
    ServiceInput:
      type: object
      required: [name, priceMin, priceMax]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        priceMin: { type: number }
        priceMax: { type: number }
    ServiceUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        description: { type: ["string", "null"] }
        priceMin: { type: number }
        priceMax: { type: number }
    TeamMember:
      type: object
      required: [id, name, email, role, status, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        role: { type: string, enum: [owner, dispatcher, cleaner] }
        status: { type: string, enum: [active, invited] }
        createdAt: { type: string }
    TeamMemberInput:
      type: object
      required: [name, email, role]
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string, format: email }
        role: { type: string, enum: [dispatcher, cleaner] }
    Call:
      type: object
      required: [id, callerName, callerPhone, status, startedAt, durationSeconds, isTest]
      properties:
        id: { type: integer }
        callerName: { type: string }
        callerPhone: { type: string }
        status: { type: string, enum: [in_progress, completed, missed, booked] }
        serviceRequested: { type: ["string", "null"] }
        preferredTime: { type: ["string", "null"] }
        startedAt: { type: string }
        durationSeconds: { type: integer }
        isTest: { type: boolean }
        bookingId: { type: ["integer", "null"] }
        direction: { type: ["string", "null"], enum: [incoming, outgoing, null] }
        summary: { type: ["string", "null"] }
        quoCallId: { type: ["string", "null"] }
    TranscriptSegment:
      type: object
      required: [speaker, text, offsetSeconds]
      properties:
        speaker: { type: string, enum: [caller, ai] }
        text: { type: string }
        offsetSeconds: { type: integer }
    ExtractedAnswer:
      type: object
      required: [field, value]
      properties:
        field: { type: string }
        value: { type: string }
    CallDetail:
      type: object
      required: [id, callerName, callerPhone, status, startedAt, durationSeconds, isTest, transcript, extractedAnswers]
      properties:
        id: { type: integer }
        callerName: { type: string }
        callerPhone: { type: string }
        status: { type: string, enum: [in_progress, completed, missed, booked] }
        serviceRequested: { type: ["string", "null"] }
        preferredTime: { type: ["string", "null"] }
        startedAt: { type: string }
        durationSeconds: { type: integer }
        isTest: { type: boolean }
        bookingId: { type: ["integer", "null"] }
        direction: { type: ["string", "null"], enum: [incoming, outgoing, null] }
        summary: { type: ["string", "null"] }
        quoCallId: { type: ["string", "null"] }
        recordingUrl: { type: ["string", "null"] }
        transcript:
          type: array
          items:
            $ref: "#/components/schemas/TranscriptSegment"
        extractedAnswers:
          type: array
          items:
            $ref: "#/components/schemas/ExtractedAnswer"
    Booking:
      type: object
      required: [id, customerName, customerPhone, service, scheduledFor, status, jobberSynced, createdAt]
      properties:
        id: { type: integer }
        callId: { type: ["integer", "null"] }
        customerName: { type: string }
        customerPhone: { type: string }
        customerAddress: { type: ["string", "null"] }
        service: { type: string }
        scheduledFor: { type: string }
        status: { type: string, enum: [pending, confirmed, completed, canceled] }
        jobberSynced: { type: boolean }
        jobberJobId: { type: ["string", "null"] }
        createdAt: { type: string }
    BookingUpdate:
      type: object
      properties:
        status: { type: string, enum: [pending, confirmed, completed, canceled] }
        scheduledFor: { type: string }
    DashboardSummary:
      type: object
      required: [callsToday, callsThisWeek, bookingsThisWeek, answeredRate, avgCallSeconds, pendingBookings, jobberSyncedCount]
      properties:
        callsToday: { type: integer }
        callsThisWeek: { type: integer }
        bookingsThisWeek: { type: integer }
        answeredRate: { type: number }
        avgCallSeconds: { type: integer }
        pendingBookings: { type: integer }
        jobberSyncedCount: { type: integer }
    ActivityItem:
      type: object
      required: [id, type, message, occurredAt]
      properties:
        id: { type: integer }
        type: { type: string, enum: [call_answered, booking_created, jobber_synced, test_call, team_invited] }
        message: { type: string }
        occurredAt: { type: string }
